          selected = random.sample(unprocessed, select_count)
          print(f"🎲 随机选择 {select_count} 个作品进行处理")
          
          # 多线程处理
          success_count = 0
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = {executor.submit(process_collection, c): c for c in selected}
              for future in as_completed(futures):
                  try:
                      uuid = future.result()
                      success_count += 1
                  except Exception as e:
                      print(f"❌ 处理失败：{e}")
          
          print("=" * 50)
          print(f"🦋 任务完成！成功处理 {success_count}/{select_count} 个作品")
